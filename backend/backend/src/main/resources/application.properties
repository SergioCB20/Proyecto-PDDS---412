# ── Servidor ──────────────────────────────────────────
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${CONTEXT_PATH:}

# ── Base de datos ─────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ── Flyway ─────────────────────────────────────────────
spring.flyway.baseline-on-migrate=true
# baseline-version=30: Salta V1-V30 en DB fresca porque JPA ddl-auto=update crea tablas y V31
# repara columnas faltantes con IF NOT EXISTS. Seed data (usuarios, roles, nodos, vuelos) no se
# inserta automaticamente en DB fresca — requiere DataSeeder o ejecutar V1-V30 manualmente.
spring.flyway.baseline-version=30
# Auto-repair checksums antes de migrar: util porque a veces las versiones se
# editan en local despues del deploy (anotando decisiones de diseno en el
# archivo) y no queremos exigir un limpiado manual de flyway_schema_history.
# Repair solo actualiza entradas con success=t y no toca nada mas.
spring.flyway.repair-on-migrate=true

# ── Logging (Hibernate SQL via logback, no System.out) ─
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# ── Redis ─────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=1000
spring.data.redis.connect-timeout=1000

# ── HikariCP ──────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

# ── JWT ───────────────────────────────────────────────

# ── Scheduler (evitar que planificador bloquee tick) ──
spring.task.scheduling.pool.size=4

# ── Paginacion ─────────────────────────────────────────
spring.data.web.pageable.max-page-size=3000

# ── Simulacion ─────────────────────────────────────────
app.simulacion.ruta-archivos=${RUTA_ENVIOS:src/main/resources/data/}
# Carga del juego de datos de simulacion al arrancar (si la tabla esta vacia).
# Ponerla en false en el servidor del escenario de colapso: alli se purga y recarga
# una ventana repetidamente, y esta carga async puede colarse tras un TRUNCATE e
# inyectar el dataset de simulacion encima del de colapso.
app.simulacion.carga-automatica=${CARGA_AUTOMATICA:true}

# Enrutamiento: ACO por defecto. Greedy elige siempre la salida mas temprana y amontona la
# carga en los mismos vuelos, colapsando por SLA con aviones y almacenes aun en verde.
app.simulacion.prefer-greedy=${SIMULACION_PREFER_GREEDY:false}
# Colonia: mas hormigas e iteraciones = mejor reparto de la carga, a costa de tiempo.
# Presupuesto: el planificador corre cada sa-segundos (30s) y con k=120 eso es 1 hora
# virtual, ~500 envios con la densidad del juego de datos de colapso. A ~5ms por recorrido
# y envio, 4x2 = 8 recorridos = ~40ms/envio = ~20s por pasada, con margen sobre los 30s.
# Subirlos mejora el reparto pero arriesga que una pasada no termine antes de la siguiente.
app.simulacion.aco.hormigas=${ACO_HORMIGAS:4}
app.simulacion.aco.iteraciones=${ACO_ITERACIONES:2}
# Horas por delante en las que ACO puede elegir vuelos. El grafo razona por hora del dia,
# asi que sin recorte asignaba vuelos de +32h creyendolos cercanos y las maletas ocupaban
# almacen todo ese rato. 0 desactiva el recorte.
app.simulacion.aco.horizonte-horas=${ACO_HORIZONTE_HORAS:18}
# Envios que el planificador enruta por ciclo. Debe cubrir el ritmo de llegada o las maletas
# se acumulan en REGISTRADO y los aviones vuelan vacios: con la densidad de 2028 llegan
# ~1.860/hora virtual (= los 30s del ciclo) y el techo anterior de 200 dejaba fuera al 98%.
app.simulacion.max-equipajes-ciclo=${SIMULACION_MAX_EQ_CICLO:2000}
# Primer dia de datos de los archivos _envios_*.txt (define el minimo de fecha_inicio_virtual).
app.simulacion.fecha-base-archivo=${SIMULACION_FECHA_BASE:2026-01-02}

# ── Colapso logistico ──────────────────────────────────
# Juego de datos EXCLUSIVO del escenario de colapso (historico + proyectado, mayor tasa de
# llegada). Si no se define, cae al de simulacion para no romper entornos existentes.
app.colapso.ruta-archivos=${RUTA_ENVIOS_COLAPSO:src/main/resources/data-colapso/}
app.simulacion.k=${SIMULACION_K:120}
app.simulacion.sa-segundos=${SIMULACION_SA:30}
app.simulacion.ventana-horas=${SIMULACION_VENTANA_HORAS:4}
# (prefer-greedy se define mas arriba, junto a los parametros de la colonia ACO)

# JACKSON — ISO dates by default
